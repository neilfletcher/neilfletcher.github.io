<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10140f">
<title>Loose! A Company of Archers</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JF54HQGVLT"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-JF54HQGVLT');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: gritty campaign ledger, gallows humour, mobile-game snap
IDEA: a captain's muster book in a soaked camp in 1415
PICTURE: the top-down battlefield itself; portraits drawn from the same sprites
COLOUR and TYPE: deep field green, St George red, gilt for rarity; IM Fell for titles, Inter for the rest
LAYOUT: phone column, tabs at the bottom, battle full screen
*/
:root{--bg:#10140f;--p:#192117;--p2:#212b1e;--line:#2f3b2b;--ink:#ece6d6;--mut:#98a391;--red:#c8372d;--gold:#e8b64c;
--r0:#aeaca2;--r1:#72c35d;--r2:#55a2ea;--r3:#b874ea;--r4:#f2b233}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 0%,#24301f 0%,var(--bg) 70%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.fell{font-family:"IM Fell English SC",Georgia,serif;letter-spacing:.02em}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.logo{font-family:"IM Fell English SC",serif;font-size:26px;line-height:1;color:var(--ink)}
.logo b{color:var(--red)}
.rank{font-size:11px;color:var(--mut)}
.brand{flex:1}
.cur{display:flex;gap:6px}
.coin{background:var(--p2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.coin.s{color:#dfe3e8}.coin.r{color:var(--gold)}
.ib{width:34px;height:34px;border-radius:10px;background:var(--p2);border:1px solid var(--line);display:grid;place-items:center}
main{flex:1;overflow-y:auto;padding:6px 14px 24px}
nav{display:flex;border-top:1px solid var(--line);background:#0c100b;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0 9px;font-size:11px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold)}
nav .dot{position:absolute;margin:-2px 0 0 18px;width:8px;height:8px;border-radius:50%;background:var(--red)}
h2{font-family:"IM Fell English SC",serif;font-weight:400;font-size:24px;margin:14px 0 2px}
h3{font-size:11px;letter-spacing:.12em;color:var(--mut);margin:18px 0 8px;font-weight:700}
.sub{color:var(--mut);font-size:12.5px}
.sub b{color:var(--ink)}
.card{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.btn{background:var(--p2);border:1px solid #3d4b38;border-radius:10px;padding:9px 14px;font-weight:700;white-space:nowrap;min-height:40px}
.btn.gold{background:linear-gradient(#f0c35c,#c08a26);color:#22170a;border-color:#f0c35c}
.btn.red{background:linear-gradient(#d4473b,#9a2a22);color:#fff;border-color:#d4473b}
.btn.ghost{color:#e9988c;border-color:#5a2a24}
.btn:disabled{opacity:.4;cursor:default}
.big{width:100%;padding:14px;font-size:17px}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);margin:3px 3px 0 0;color:var(--mut)}
.pill.g{color:#a8dd8e;border-color:#3e6a2e;background:#18240f}
.pill.b{color:#e9988c;border-color:#5a2a24;background:#24120f}
.stars{color:#3a4636;letter-spacing:1px;font-size:14px}
.stars i{font-style:normal;color:var(--gold)}
/* chapters */
.chap{border-radius:14px;padding:14px;margin:12px 0;border:1px solid var(--line);background:linear-gradient(160deg,#22301d,#141b12)}
.chap.lock{opacity:.5}
.chap .yr{font-size:11px;color:var(--gold);letter-spacing:.1em;font-weight:700}
.trail{position:relative;margin-top:10px;padding-left:4px}
.trail:before{content:"";position:absolute;left:25px;top:20px;bottom:20px;border-left:2px dashed #3d4b38}
.node{display:flex;align-items:center;gap:12px;padding:6px 0;cursor:pointer;position:relative}
.node .n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#263222;border:2px solid #475a40;flex:none;z-index:1}
.node.done .n{background:#3a2f12;border-color:var(--gold);color:var(--gold)}
.node.next .n{background:var(--red);border-color:#f08a7c;color:#fff;box-shadow:0 0 0 4px rgba(200,55,45,.25)}
.node.lock{opacity:.4;cursor:default}
.node.boss .n{border-radius:12px}
.tag{font-size:10px;font-weight:800;letter-spacing:.08em;padding:1px 6px;border-radius:4px;background:#2a3526;color:var(--mut);margin-left:6px}
.tag.boss{background:#3d1612;color:#f0a094}.tag.amb{background:#13283d;color:#9cc8f0}
/* archers */
.pt{width:52px;height:52px;border-radius:12px;flex:none;display:block}
.nm{font-weight:700}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}.r4{color:var(--r4)}
.xp{height:5px;border-radius:4px;background:#2a3426;overflow:hidden;margin-top:4px}
.xp i{display:block;height:100%;background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pick{background:var(--p);border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center;cursor:pointer;position:relative}
.pick .pt{margin:0 auto 4px;width:60px;height:60px}
.pick.sel{border-color:var(--gold);background:#2a2614}
.pick.off{opacity:.35;cursor:default}
.pick small{display:block;font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .lv{position:absolute;top:4px;right:6px;font-size:10px;font-weight:800;color:var(--mut)}
/* sheet */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:40}
#modal.show{display:block}
#sheet{position:absolute;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;max-height:90%;overflow-y:auto;background:#151c13;border:1px solid var(--line);border-radius:18px 18px 0 0;padding:8px 16px 22px}
.handle{width:42px;height:4px;border-radius:4px;background:#3d4b38;margin:4px auto 10px}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stat4 div{background:#0f140e;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center}
.stat4 b{display:block;font-size:16px}.stat4 span{font-size:10px;color:var(--mut);letter-spacing:.05em}
.bio{font-family:Georgia,serif;font-style:italic;color:#c7c0ad;font-size:14px;margin:8px 0}
/* tavern */
.tav{border-radius:14px;padding:16px;background:linear-gradient(170deg,#3a2614,#1a120a);border:1px solid #5a3d1e;margin-top:10px}
.odds{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.odds span{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:rgba(0,0,0,.3)}
.reveal{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.rc{perspective:600px;height:132px}
.rc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.rc.open .in{transform:rotateY(180deg)}
.rc .fc,.rc .bk{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center}
.rc .bk{background:repeating-linear-gradient(45deg,#3a2614 0 6px,#2c1c0e 6px 12px);border:2px solid #6a4a24;font-family:"IM Fell English SC",serif;font-size:28px;color:#8a6a3a}
.rc .fc{transform:rotateY(180deg);background:#151c13;border:2px solid}
.rc .fc .pt{width:58px;height:58px;margin-bottom:4px}
.rc .fc small{font-size:11px;line-height:1.2}
.rc.r4 .fc{box-shadow:0 0 22px rgba(242,178,51,.6)}
.rc.r3 .fc{box-shadow:0 0 14px rgba(184,116,234,.45)}
/* camp */
.pips{display:flex;gap:3px;margin-top:5px}.pips i{width:16px;height:5px;border-radius:3px;background:#2f3b2b}.pips i.on{background:var(--gold)}
.bico{width:46px;height:46px;border-radius:12px;background:#0f140e;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.bico svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* battle */
#battle{position:fixed;inset:0;background:#070906;display:none;flex-direction:column;z-index:30}
#battle.show{display:flex}
.btop{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0d110c;border-bottom:1px solid var(--line)}
.btop .t{font-family:"IM Fell English SC",serif;font-size:18px;line-height:1.1}
#bObj{font-size:12px;color:var(--mut)}
.bctl{display:flex;gap:5px}
.bctl button{min-width:40px;height:36px;border-radius:9px;background:var(--p2);border:1px solid var(--line);font-weight:800;font-size:13px}
#objbar{height:6px;background:#2a1a14}
#objbar i{display:block;height:100%;background:linear-gradient(90deg,#c8372d,#e8b64c);transition:width .2s}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cv{display:block;touch-action:none;border-radius:4px}
#bMsg{position:absolute;top:30%;left:0;right:0;text-align:center;pointer-events:none;font-family:"IM Fell English SC",serif;font-size:30px;color:#fff3d6;text-shadow:0 3px 14px #000,0 0 2px #000;opacity:0;transition:opacity .35s,transform .35s;transform:scale(.9)}
#bMsg.on{opacity:1;transform:scale(1)}
#bMsg small{display:block;font-family:Inter;font-size:13px;color:#e8dcc0}
#tray{display:flex;gap:6px;padding:8px 10px;background:#0d110c;border-top:1px solid var(--line);justify-content:center;flex-wrap:wrap}
.tu{position:relative;width:58px;text-align:center;font-size:10px;color:var(--mut)}
.tu .ring{width:52px;height:52px;border-radius:50%;margin:0 auto;padding:3px;background:conic-gradient(var(--gold) var(--c,0%),#2a3426 0)}
.tu .ring img{width:46px;height:46px;border-radius:50%;display:block;background:#0f140e}
.tu.ready .ring{animation:pulse 1s infinite;background:var(--gold)}
.tu.ready:after{content:"TAP";position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;background:var(--gold);color:#22170a;border-radius:4px;padding:0 4px}
.tu.down{opacity:.35;filter:grayscale(1)}
.tu .hb{height:4px;background:#3a1a14;border-radius:3px;margin:3px 2px 0;overflow:hidden}.tu .hb i{display:block;height:100%;background:#7fcf5a}
.tu span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(232,182,76,.35)}}
#bHint{padding:6px 12px 10px;background:#0d110c;text-align:center;font-size:12.5px;color:var(--mut);display:flex;gap:10px;align-items:center;justify-content:center}
#vol{display:flex;align-items:center;gap:8px}
#vol .vr{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--red) var(--c,0%),#2a3426 0);display:grid;place-items:center}
#vol .vr i{width:22px;height:22px;border-radius:50%;background:#0d110c;display:block}
#results{position:absolute;inset:0;background:rgba(5,7,5,.82);display:none;overflow-y:auto;z-index:5}
#results.show{display:block}
.res{max-width:440px;margin:0 auto;padding:22px 16px 30px}
.res h1{font-family:"IM Fell English SC",serif;font-weight:400;font-size:40px;text-align:center;margin:6px 0 0}
.bigstars{text-align:center;font-size:44px;letter-spacing:6px;color:#3a4636;margin:4px 0}
.bigstars i{font-style:normal;color:var(--gold);display:inline-block;animation:pop .4s backwards}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}}
.loot{display:flex;justify-content:center;gap:10px;margin:8px 0 14px}
.rl{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #22301f}
.rl .pt{width:44px;height:44px}
.dead .nm{color:#e9988c;text-decoration:line-through}
.ev{font-family:Georgia,serif;font-size:15.5px;line-height:1.55;color:#ddd5c2}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:#2a1712;border:1px solid #6e3326;color:#f3c3b5;padding:9px 16px;border-radius:10px;font-size:13px;z-index:80;display:none;max-width:90%;text-align:center}
#toast.ok{background:#18240f;border-color:#3e6a2e;color:#cfe8b8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><div class="logo">Loose<b>!</b></div><div class="rank" id="rank"></div></div>
    <div class="cur"><span class="coin s" id="silver"></span><span class="coin r" id="renown"></span></div>
    <button class="ib" id="snd" aria-label="Sound"></button>
  </header>
  <main id="view"></main>
  <nav>
    <button data-tab="war" class="on"><svg viewBox="0 0 24 24"><path d="M5 21V4h12l-2.5 4L17 12H5"/></svg>Campaign</button>
    <button data-tab="company"><svg viewBox="0 0 24 24"><path d="M7 3c9 4 9 14 0 18M7 3v18M4 12h16M17 9l3 3-3 3"/></svg>Company</button>
    <button data-tab="tavern"><svg viewBox="0 0 24 24"><path d="M5 8h10v12H5zM15 11h3v6h-3M5 8c0-4 10-4 10 0M8 11v6M12 11v6"/></svg>Tavern</button>
    <button data-tab="camp"><svg viewBox="0 0 24 24"><path d="M2 20L12 4l10 16zM12 4v16M9 20l3-5 3 5"/></svg>Camp</button>

</div>
<div id="modal"><div id="sheet"></div></div>
<div id="battle">
  <div class="btop">
    <div class="grow"><div class="t" id="bTitle"></div><div id="bObj"></div></div>
    <div class="bctl"><button id="bQuit">Retreat</button><button id="bPause" aria-label="Pause">❚❚</button><button id="bSpeed">1×</button></div>
  </div>
  <div id="objbar"><i style="width:100%"></i></div>
  <div id="stage"><canvas id="cv"></canvas><div id="bMsg"></div></div>
  <div id="tray"></div>
  <div id="bHint"></div>
  <div id="results"></div>
</div>
<div id="toast"></div>

<script>
{
'use strict';
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('en-GB');
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ================= data ================= */
const RAR = [{n:'Common',c:'#aeaca2'},{n:'Uncommon',c:'#72c35d'},{n:'Rare',c:'#55a2ea'},{n:'Epic',c:'#b874ea'},{n:'Legendary',c:'#f2b233'}];
const CLS = {

  yeoman:  {n:'Yeoman', rar:1, hp:75, dmg:15, int:1.2, range:160, ab:'aimed', abN:'Aimed shot', abD:'One huge shot at the toughest man in reach.', look:{tunic:'#e6e0cf', trim:'#c8372d', cross:1, head:'cap'}},

  genoese: {n:'Genoese Crossbow', rar:2, hp:95, dmg:34, int:2.4, range:150, pierce:5, xbow:1, ab:'heavy', abN:'Heavy bolt', abD:'A bolt that goes through every man in a line.', look:{tunic:'#8d96a3', trim:'#c8372d', xbow:1, head:'kettle'}},
  veteran: {n:'Veteran Archer', rar:3, hp:95, dmg:18, int:1.0, range:175, pierce:3, ab:'bodkin', abN:'Bodkins', abD:'Shots ignore armour and hit 30% harder for six seconds.', look:{tunic:'#7a2a26', trim:'#e8b64c', head:'kettle', studs:1}}
};
const HEROES = {
  jack:    {n:'Mad Jack Hale', title:'Fire-raiser', hp:90, dmg:20, int:1.0, range:170, ab:'fire', abN:'Fire arrows', abD:'Every shot bursts into flame for seven seconds.', bio:'Burnt down two French villages and one English one. Mostly by accident.', look:{tunic:'#3a2a20', trim:'#ff7a2a', head:'bare', cape:'#8a2a12'}},

  tom:     {n:'Black Tom Ashby', title:'Heavy war bow', hp:110, dmg:30, int:1.6, range:195, pierce:5, ab:'through', abN:'Straight through', abD:'A shot that passes through every man in its path.', bio:'Draws a bow nobody else can bend. Has said eleven words since Easter.', look:{tunic:'#1e1e22', trim:'#c8372d', head:'kettle', cape:'#111'}},
  ambrose: {n:'Brother Ambrose', title:'Fighting friar', hp:85, dmg:15, int:1.1, range:160, ab:'absolve', abN:'Absolution', abD:'Heals the whole company and raises the fallen.', bio:'Left the friary over a disagreement about violence. He was for it.', look:{tunic:'#6b4e2e', trim:'#e8d9b0', head:'tonsure', cape:'#4a3520'}}
};
const TRAITS = {
  keen:{n:'Keen-eyed', d:'Range +12%', g:1}, quick:{n:'Quick hands', d:'Loose rate +12%', g:1}, strong:{n:'Strong arm', d:'Damage +12%', g:1},
  tough:{n:'Tough as boots', d:'Health +25%', g:1}, lucky:{n:'Lucky', d:'Half as likely to die when he falls', g:1}, steady:{n:'Steady', d:'Rarely misses', g:1},
  pious:{n:'Pious', d:'Slowly heals during a fight', g:1}, greedy:{n:'Greedy', d:'+10% silver, and you can tell', g:1}, brawler:{n:'Brawler', d:'Double damage at arm\'s length', g:1},
  drunk:{n:'Drunkard', d:'Misses more, health +10%', g:0}, nervous:{n:'Nervous', d:'Loose rate -10%', g:0}, slow:{n:'Slow learner', d:'Experience -30%', g:0}
};
const EN = {
  levy:   {n:'Levy', hp:30, spd:22, dps:5, arm:0, aggro:34, brk:8, pay:2, r:6},
  spear:  {n:'Spearman', hp:45, spd:20, dps:7, arm:2, aggro:38, brk:10, pay:3, r:6.5},
  xbow:   {n:'Crossbowman', hp:35, spd:18, dps:0, arm:1, aggro:0, range:125, bolt:11, cd:2.8, brk:8, pay:4, r:6.5},
  maa:    {n:'Man-at-arms', hp:110, spd:14, dps:10, arm:6, aggro:40, brk:15, pay:7, r:7.5},
  knight: {n:'Knight', hp:150, spd:46, dps:12, charge:22, arm:7, aggro:62, brk:20, pay:12, r:11, cav:1},
  boss:   {n:'Captain', hp:900, spd:12, dps:20, arm:8, aggro:45, brk:60, pay:80, r:10, boss:1},
  cart:   {n:'Supply cart', hp:420, spd:19, dps:0, arm:4, aggro:0, brk:0, pay:25, r:13, cart:1}
};

function base(a){ return a.cls === 'hero' ? HEROES[a.hero] : CLS[a.cls]; }
function look(a){ return Object.assign({rar:RAR[a.rar].c}, base(a).look); }
function pickTrait(goodP, have){
  const keys = Object.keys(TRAITS).filter(k => !have.includes(k));
  const g = keys.filter(k => TRAITS[k].g), b = keys.filter(k => !TRAITS[k].g);
  return (Math.random() < goodP || !b.length) ? pick(g) : pick(b);
}
function genName(cls){
  if (cls === 'welsh') return pick(WFIRST) + ' ' + pick(WLAST);
  if (cls === 'genoese') return pick(GFIRST) + ' ' + pick(GLAST);
  const f = pick(FIRST); return Math.random() < .22 ? `${f} ${pick(NICK)}` : `${f} ${pick(LAST)}`;
}
function genBio(cls){
  if (cls === 'genoese') return pick(['Crossbowman from Genoa, paid in advance. Thinks the English food is a war crime.','Changed sides twice last year. Currently on yours.','Mercenary. Will not discuss which side he was on at Nicopolis.']);

  else { a.name = genName(cls); a.bio = genBio(cls); const n = rar >= 2 ? 2 : 1; for (let i = 0; i < n; i++) a.traits.push(pickTrait(.45 + rar * .14, a.traits)); }

function stats(a){

    hp: Math.round(b.hp * 1.3 * (1 + .07 * L) * (t.includes('tough') ? 1.25 : 1) * (t.includes('drunk') ? 1.1 : 1)),
    dmg: b.dmg * (1 + .07 * L) * (t.includes('strong') ? 1.12 : 1) * (1 + .08 * bd.fletcher),

  const c = document.createElement('canvas'), k = 2; c.width = c.height = size * k; const g = c.getContext('2d'); g.scale(k, k);
  const col = RAR[a.rar].c;
  const gr = g.createRadialGradient(size * .5, size * .45, 2, size * .5, size * .5, size * .7); gr.addColorStop(0, '#3b4a33'); gr.addColorStop(1, '#141a12');
  g.fillStyle = gr; g.beginPath(); g.roundRect ? g.roundRect(0, 0, size, size, size * .22) : g.rect(0, 0, size, size); g.fill();
  g.strokeStyle = col; g.lineWidth = 2.5; g.stroke();

  c.fillStyle = '#7a5a3a'; c.beginPath(); c.ellipse(18, 0, 7, 4.2, 0, 0, 7); c.fill(); c.beginPath(); c.arc(24.5, 0, 2.6, 0, 7); c.fill();
  c.strokeStyle = '#e8e0cc'; c.lineWidth = 1; c.beginPath(); c.moveTo(25, -2); c.lineTo(26.5, -4); c.moveTo(25, 2); c.lineTo(26.5, 4); c.stroke();
  c.strokeStyle = '#4a3020'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(9, 0); c.lineTo(12, 0); c.stroke();
  c.fillStyle = '#1e1610'; c.fillRect(-8, -9.5, 7, 2.4); c.fillRect(-8, 7.1, 7, 2.4); c.fillRect(2, -9.5, 7, 2.4); c.fillRect(2, 7.1, 7, 2.4);
  c.fillStyle = '#7a5532'; c.fillRect(-12, -7.5, 22, 15);
  c.fillStyle = french ? '#cfd6e6' : '#ddd1b2'; c.beginPath(); c.roundRect ? c.roundRect(-11, -6.5, 19, 13, 3) : c.rect(-11, -6.5, 19, 13); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = .8; for (let i = -8; i <= 6; i += 4.5) { c.beginPath(); c.moveTo(i, -6.5); c.lineTo(i, 6.5); c.stroke(); }
  if (french) { c.fillStyle = '#2f4f8f'; c.beginPath(); c.arc(-1.5, 0, 3, 0, 7); c.fill(); c.fillStyle = '#e8c64a'; c.beginPath(); c.arc(-1.5, 0, 1.2, 0, 7); c.fill(); }
  c.restore();
}

/* ================= gacha ================= */
function weights(){ const t = S.build.tavern; return [50 - t * 1.5, 30, 14, 5 + t, 1 + t * .3]; }
function rollRar(){
  S.pity++; if (S.pity >= 40) { S.pity = 0; return 4; }
  const w = weights(); let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < 5; i++) { r -= w[i]; if (r <= 0) { if (i === 4) S.pity = 0; return i; } }
  return 0;
}
function pull(n){
  const cost = n === 10 ? 900 : 100;
  if (S.roster.length + n > rosterCap()) { toast(`No room on the roll. Pay someone off or build up the Tavern.`); return; }
  if (!spend(cost)) return;
  const out = [];
  for (let i = 0; i < n; i++) {
    let r = rollRar();
    if (n === 10 && i === 9 && !out.some(o => o.a.rar >= 2) && r < 2) r = 2;
    let a, dupe = null;
    if (r === 4) {
      const keys = Object.keys(HEROES), unowned = keys.filter(k => !S.roster.some(x => x.hero === k));
      const k = unowned.length && Math.random() < .8 ? pick(unowned) : pick(keys);
      const have = S.roster.find(x => x.hero === k);
      if (have) { have.lvl = Math.min(10, have.lvl + 2); dupe = have; a = have; }
      else a = newArcher(4, 'hero', k);
    } else a = newArcher(r, r === 0 ? 'levy' : r === 1 ? 'yeoman' : r === 2 ? (Math.random() < .55 ? 'welsh' : 'genoese') : 'veteran');
    if (!dupe) S.roster.push(a);
    out.push({a, dupe});
  }
  S.pulls += n; save(); render(); sfx('coin');
  gtag('event', 'recruit', {count:n, best:Math.max(...out.map(o => o.a.rar))});
  openSheet(`<div class="fell" style="font-size:26px;text-align:center">New recruits</div><div class="sub" style="text-align:center">Tap to turn them over, or wait.</div><div class="reveal">${out.map((o, i) => `<div class="rc r${o.a.rar}" data-i="${i}"><div class="in"><div class="bk">?</div><div class="fc" style="border-color:${RAR[o.a.rar].c}"><img class="pt" src="${portrait(o.a, 58)}" alt=""><small class="nm r${o.a.rar}">${esc(o.a.name)}</small><small class="sub">${o.dupe ? 'Already serves: +2 levels' : o.a.cls === 'hero' ? HEROES[o.a.hero].title : CLS[o.a.cls].n}</small></div></div></div>`).join('')}</div><button class="btn gold big" style="margin-top:14px" data-act="close">Welcome aboard</button>`);
  const cards = [...document.querySelectorAll('.rc')];
  cards.forEach(c => c.addEventListener('click', () => flip(c, out[+c.dataset.i].a.rar)));
  cards.forEach((c, i) => setTimeout(() => flip(c, out[i].a.rar), 450 + i * 260));
}
function flip(c, rar){ if (c.classList.contains('open')) return; c.classList.add('open'); sfx(rar >= 3 ? 'legend' : 'flip'); }

/* ================= levels ================= */
const LAYOUTS = {
  straight:[[[.5,-.04],[.46,.3],[.55,.62],[.5,.93]]],
  snake:[[[.22,-.04],[.25,.26],[.76,.44],[.72,.7],[.5,.93]]],
  bend:[[[.86,-.04],[.8,.3],[.28,.5],[.42,.93]]],
  bendL:[[[.14,-.04],[.2,.3],[.72,.5],[.58,.93]]],
  fork:[[[.14,-.04],[.2,.42],[.5,.93]],[[.86,-.04],[.8,.42],[.5,.93]]],
  convoy:[[[-.07,.3],[.3,.37],[.62,.27],[1.07,.35]]]
};
function genLevel(ci, n, endless){
  const C = CHAPTERS[ci], d = ci * 6 + n + 1, rng = mulberry(endless ? Date.now() : 7919 * (ci + 1) + n * 131);
  const type = endless ? 'endless' : C.types[n];
  const lay = type === 'ambush' ? 'convoy' : pickR(rng, n === 0 && ci === 0 ? ['straight'] : n < 2 ? ['straight','snake','bend','bendL'] : ['snake','bend','bendL','fork']);
  const pool = Object.entries(C.pool);
  const sample = heavy => { const tot = pool.reduce((s, [k, w]) => s + w * (heavy && EN[k].arm > 3 ? 1.8 : 1), 0); let r = rng() * tot; for (const [k, w] of pool) { r -= w * (heavy && EN[k].arm > 3 ? 1.8 : 1); if (r <= 0) return k; } return pool[0][0]; };
  const paths = LAYOUTS[lay].length, spawns = [];
  let D = 0;
  if (type === 'defend' || type === 'boss') {
    D = 38 + d * 2.4; let t = 2, pi = 0;
    while (t < D) { const g = 1 + Math.floor(rng() * (1 + d / 6)); const ty = sample(t > D * .5); for (let k = 0; k < g; k++) spawns.push({t:t + k * .55, type:ty, p:pi % paths}); pi++; t += Math.max(2.6, 5.2 - d * .12) * (.7 + rng() * .6); }
    if (type === 'boss') { spawns.push({t:D * .45, type:'boss', p:0}); for (let k = 0; k < 4; k++) spawns.push({t:D * .45 + 1 + k * .6, type:sample(true), p:0}); }
  } else if (type === 'ambush') {
    for (let k = 0; k < 4; k++) spawns.push({t:2 + k * 5.5, type:'cart', p:0});
    for (let t = 1; t < 24; t += Math.max(1.8, 3.6 - d * .1)) spawns.push({t, type:sample(true), p:0});
  }
  spawns.sort((a, b) => a.t - b.t);
  return {key:endless ? 'skirmish' : levelKey(ci, n), ci, n, type, name:endless ? 'Skirmish at the Forage Camp' : C.lv[n][0], intro:endless ? 'The foragers need a camp. The French need you to not have one.' : C.lv[n][1], chapterName:endless ? 'Repeatable' : C.n, paths:LAYOUTS[lay], spawns, D, hpMul:1 + d * .045, mud:C.mud, grass:C.grass, reward:endless ? 0 : 60 + d * 14, bossName:C.boss, d, seed:ci * 100 + n, pool};
}
function pickR(rng, a){ return a[Math.floor(rng() * a.length)]; }

/* ================= events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || !el.dataset.act) { if (e.target.id === 'modal') closeSheet(); return; }
  ac();
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'close': closeSheet(); break;
    case 'level': sheetLevel(genLevel(+el.dataset.ch, +el.dataset.n)); break;
    case 'skirmish': { const unlocked = CHAPTERS.filter(C => totalStars() >= C.need).length - 1; sheetLevel(genLevel(unlocked, 3, true)); break; }
    case 'sel': { if (sel.includes(id)) sel = sel.filter(x => x !== id); else if (sel.length < squadSize()) sel.push(id); else { toast(`You can only lead ${squadSize()} men. Earn renown for more.`); return; } const sc = $('#sheet').scrollTop; sheetLevel.redraw(); $('#sheet').scrollTop = sc; break; }
    case 'go': closeSheet(); startBattle(sheetLevel.def, sel.map(i => S.roster.find(x => x.id === i)).filter(Boolean)); break;
    case 'archer': sheetArcher(id); break;
    case 'dismiss': {
      if (el.dataset.c !== '1') { el.dataset.c = '1'; el.textContent = 'Sure?'; return; }
      const ar = S.roster.find(x => x.id === id); S.roster = S.roster.filter(x => x.id !== id); S.silver += 20 * (ar.rar + 1); closeSheet(); toast(`${ar.name} takes his pay and heads for the nearest alehouse.`, true); save(); render(); break;
    }
    case 'pull': pull(+el.dataset.n); break;
    case 'build': { const l = S.build[id]; if (!spend(BCOST[l])) return; S.build[id]++; sfx('coin'); toast(`${BUILD[id].n} upgraded.`, true); gtag('event', 'build', {item:id, level:S.build[id]}); save(); render(); break; }
    case 'reset': { if (el.dataset.c !== '1') { el.dataset.c = '1'; el.textContent = 'Really?'; return; } try { localStorage.removeItem(KEY); } catch(e){} load(); save(); render(); toast('A fresh company. Same mud.', true); break; }
    case 'evc': eventChoice(+el.dataset.i); break;
    case 'resdone': afterResults(); break;
  }
});

    if (f.blood) { ctx.fillStyle = `rgba(150,20,15,${1 - f.t / .5})`; ctx.fillRect(f.x, f.y, 1.6, 1.6); continue; }
    if (f.burn) { const s = f.t / 1.2; ctx.fillStyle = `rgba(255,${140 - s * 100},40,${.8 * (1 - s)})`; ctx.beginPath(); ctx.arc(f.x + Math.sin(f.t * 9) * 2, f.y - s * 14, 3 + s * 5, 0, 7); ctx.fill(); continue; }
    if (f.ring) { const s = f.t / .6; ctx.strokeStyle = f.col; ctx.globalAlpha = 1 - s; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.x, f.y, 8 + s * 22, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; continue; }
    const s = f.t / 1.3; ctx.globalAlpha = 1 - s * s; ctx.font = `${f.big ? 800 : 700} ${f.big ? 11 : 9}px Inter,sans-serif`; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillText(f.txt, f.x + .7, f.y - s * 18 + .7); ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y - s * 18); ctx.globalAlpha = 1;
  }
  if (B.def.mud && B.phase === 'fight') { ctx.strokeStyle = 'rgba(200,210,220,.18)'; ctx.lineWidth = 1; ctx.beginPath(); for (let i = 0; i < 70; i++) { const x = (i * 53 + B.t * 30) % (W + 20), y = (i * 97 + B.t * 380) % (H + 20) - 10; ctx.moveTo(x, y); ctx.lineTo(x - 2, y + 9); } ctx.stroke(); }
}
function drawUnit(u){
  if (u.down) {
    ctx.save(); ctx.translate(u.x, u.y); ctx.scale(SPR, SPR); ctx.rotate(u.face + 1.2); ctx.globalAlpha = .75;
    ctx.fillStyle = 'rgba(100,15,10,.45)'; ctx.beginPath(); ctx.ellipse(1, 1, 9, 5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = u.L.tunic; ctx.beginPath(); ctx.ellipse(0, 0, 8.5, 4.8, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#c9a882'; ctx.beginPath(); ctx.arc(9.5, 0, 3, 0, 7); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1; return;
  }
  const lift = B.drag && B.drag.u === u ? 3 : 0;
  ctx.save(); ctx.translate(u.x, u.y - lift); ctx.scale(SPR, SPR); drawArcher(ctx, 0, 0, u.face, u.L, u.drawAmt, {ring:true}); ctx.restore();
  if (u.hurtT > 0) { ctx.fillStyle = 'rgba(255,60,40,.35)'; ctx.beginPath(); ctx.arc(u.x, u.y, 9, 0, 7); ctx.fill(); }
  if (u.fireT > 0 || u.rapidT > 0 || u.bodkinT > 0) { ctx.strokeStyle = u.fireT > 0 ? '#ff7a2a' : '#f2d07a'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(u.x, u.y, 17 + Math.sin(B.t * 10) * 1.5, 0, 7); ctx.stroke(); }
  if (u.hp < u.max) { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(u.x - 10, u.y + 15, 20, 2.6); ctx.fillStyle = '#7fcf5a'; ctx.fillRect(u.x - 10, u.y + 15, 18 * Math.max(0, u.hp) / u.max, 2.6); }
  if (B.phase === 'setup') { ctx.font = '700 9px Inter,sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillText(u.a.name.split(' ')[0], u.x + .6, u.y + 26.6); ctx.fillStyle = RAR[u.a.rar].c; ctx.fillText(u.a.name.split(' ')[0], u.x, u.y + 26); }
}

/* ---------- results ---------- */
let R = null;
function finish(win, why){
  if (B.phase !== 'fight') return; B.phase = 'done';
  const def = B.def, endless = def.type === 'endless';
  let stars = 0;
  if (win && !endless) { stars = 1; if (!B.downs) stars++; if (def.type === 'ambush' ? B.carts.dead === B.carts.total : B.objHP >= 70) stars++; }
  sfx(win || endless ? 'win' : 'lose');
  const prev = S.stars[def.key] || 0, gained = Math.max(0, stars - prev);
  if (!endless && stars > prev) S.stars[def.key] = stars;
  const greedy = B.units.filter(u => u.a.traits.includes('greedy')).length;
  let silver = endless ? B.silver * 2 + Math.floor(B.t) : Math.round(B.silver + (win ? def.reward * (.5 + stars * .25) * (prev ? .6 : 1.3) : def.reward * .15));
  silver = Math.round(silver * (1 + greedy * .1) * (S.buff.silver ? 1.25 : 1));
  let renown = gained + (win && def.type === 'boss' && !prev ? 2 : 0);
  if (endless && B.t > S.skirmBest) { S.skirmBest = B.t; }
  S.silver += silver; S.renown += renown; S.battles++;
  // time passes for the wounded
  S.roster.forEach(a => { if (a.wounded) a.wounded = Math.max(0, a.wounded - 1 - (S.build.surgeon >= 3 ? 1 : 0)); });
  const rows = [];
  const xpMul = (1 + .2 * S.build.butts) * (S.buff.xp ? 1.3 : 1);
  B.units.forEach(u => {
    const a = u.a; a.battles++; a.kills += u.kills;
    let xp = Math.round((20 + u.kills * 4 + stars * 10) * xpMul * (a.traits.includes('slow') ? .7 : 1));
    const r = {a, xp, kills:u.kills, lv:false, trait:null, dead:false, wound:0};
    if (u.down) {
      const dc = .33 * (1 - .12 * S.build.surgeon) * (a.traits.includes('lucky') ? .5 : 1) * (S.buff.friar ? .5 : 1) * (win ? 1 : 1.25);
      if (Math.random() < dc) { r.dead = true; r.ep = pick(EPITAPH); S.fallen.push({name:a.name, rar:a.rar, lvl:a.lvl, kills:a.kills, where:def.name}); S.roster = S.roster.filter(x => x !== a); }
      else { a.wounded = Math.max(1, 3 - Math.floor(S.build.surgeon / 2)); r.wound = a.wounded; }
    }
    if (!r.dead) giveXp(a, xp, r);
    rows.push(r);
  });
  if (S.build.butts) S.roster.forEach(a => { if (!B.units.some(u => u.a === a)) giveXp(a, Math.round(20 * .15 * S.build.butts * (1 + stars)), {}); });
  S.buff = {};
  if (S.fallen.length > 60) S.fallen = S.fallen.slice(-60);
  save();
  gtag('event', 'battle_end', {level:def.key, win:!!win, stars, seconds:Math.floor(B.t)});
  R = {win, stars, silver, renown, rows, why, endless};
  const title = endless ? 'Withdrawn' : win ? (stars === 3 ? 'Glorious' : 'Victory') : 'Defeat';
  const sub = endless ? `Held for ${Math.floor(B.t / 60)}m ${Math.floor(B.t % 60)}s. ${B.kills} French dead.` : win ? pick(['The field is yours. So are the boots of the dead.', 'They broke. Your lads cheered, then went looking for loot.', 'A good day, for a given value of good.']) : why === 'retreat' ? 'You sounded the retreat. Nobody sings about retreats.' : why === 'carts' ? 'Too many carts got through. Somewhere a French garrison is eating well tonight.' : why === 'camp' ? 'They are in the baggage. The pay chest is gone, and so is your dinner.' : 'Overrun. The few who could ran. The rest could not.';
  $('#results').innerHTML = `<div class="res"><h1 style="color:${win || endless ? '#f2d07a' : '#e9988c'}">${title}</h1>${endless ? '' : `<div class="bigstars">${[0,1,2].map(i => i < stars ? `<i style="animation-delay:${.2 + i * .25}s">★</i>` : '★').join('')}</div>`}
  <p class="bio" style="text-align:center">${sub}</p>
  <div class="loot"><span class="coin s">+${fmt(silver)} silver</span>${renown ? `<span class="coin r">+${renown} renown</span>` : ''}</div>
  ${rows.map(r => `<div class="rl ${r.dead ? 'dead' : ''}"><img class="pt" src="${portrait(r.a, 44)}" alt=""><div class="grow"><div class="nm r${r.a.rar}">${esc(r.a.name)}</div><div class="sub">${r.dead ? `<span style="color:#e9988c">Killed. ${r.ep}</span>` : `${r.kills} kills · +${r.xp} xp${r.lv ? ` · <b style="color:var(--gold)">Level ${r.a.lvl}!</b>` : ''}${r.trait ? ` · new trait: <b>${TRAITS[r.trait].n}</b>` : ''}${r.wound ? ` · <span style="color:#e9988c">wounded, out for ${r.wound} battle${r.wound > 1 ? 's' : ''}</span>` : ''}`}</div></div></div>`).join('')}
  <button class="btn gold big" style="margin-top:16px" data-act="resdone">Back to camp</button></div>`;
  const myB = B; clearTimeout(finish._h); finish._h = setTimeout(() => { if (B === myB) $('#results').classList.add('show'); }, 700);
}
function giveXp(a, xp, r){
  if (a.lvl >= 10) return; a.xp += xp;
  while (a.lvl < 10 && a.xp >= xpNeed(a.lvl)) { a.xp -= xpNeed(a.lvl); a.lvl++; r.lv = true; if ((a.lvl === 4 || a.lvl === 8) && a.traits.length < 4) { const t = pickTrait(1, a.traits); a.traits.push(t); r.trait = t; } }
  if (a.lvl >= 10) a.xp = 0;
}
function afterResults(){
  B = null; cancelAnimationFrame(raf); $('#battle').classList.remove('show'); $('#results').classList.remove('show');
  tab = 'war'; render();
  if (S.roster.length >= 2 && Math.random() < .45) campEvent();
  else if (!S.roster.length) toast('No one left. The tavern is your only hope.');
}

/* ================= camp events ================= */
let EV = null;
function campEvent(){
  const A = pick(S.roster), Bm = pick(S.roster.filter(x => x !== A)) || A;
  const n = a => `<b class="r${a.rar}">${esc(a.name)}</b>`;
  const events = [
    {t:'Dice in the baggage train', x:`${n(A)} has won a small fortune off the quartermaster. The quartermaster has asked you, formally, to do something about it.`, c:[
      ['Take a cut for the company', () => { S.silver += 60; return `You take sixty. ${esc(A.name)} calls it robbery. It is.`; }],
      ['Let him keep it', () => { giveXp(A, 40, {}); S.renown += 1; return `The lads like a captain who lets a man keep his winnings. +1 renown.`; }]]},
    {t:'A deserter at the pickets', x:'A Frenchman with a broken nose offers the route of tomorrow\'s enemy column for fifty silver. He says he hates his captain. Everyone hates their captain.', c:[
      ['Pay him', () => { if (S.silver < 50) return 'You cannot afford him. He wanders off, looking disappointed in you.'; S.silver -= 50; S.buff.silver = 1; return 'The information is good. Next battle pays 25% more.'; }],
      ['Hang him', () => { S.renown += 1; return 'The provost hangs him from a pear tree. Nobody eats the pears. +1 renown.'; }]]},
    {t:'The flux', x:'Dysentery is going through the camp like a rumour. The surgeon says boil the water. The priest says pray.', c:[
      ['Boil the water (40 silver of firewood)', () => { S.silver = Math.max(0, S.silver - 40); return 'Firewood costs a fortune. Nobody dies. Nobody thanks you either.'; }],
      ['Pray', () => { if (Math.random() < .5) { A.wounded = Math.max(A.wounded, 2); return `${esc(A.name)} gets it badly. Out for two battles.`; } return 'Against all medical sense, it works.'; }]]},
    {t:'A matter of honour', x:`${n(A)} and ${n(Bm)} have come to blows over a woman in the baggage train. She would like it noted she has no interest in either.`, c:[
      ['Flog them both', () => { return 'Ten strokes each. Discipline holds. They glare at each other for a week.'; }],
      ['Let them settle it', () => { if (!Bm.traits.includes('brawler') && Bm.traits.length < 4) Bm.traits.push('brawler'); if (A !== Bm) A.wounded = Math.max(A.wounded, 1); return `${esc(Bm.name)} wins and gains the Brawler trait. ${esc(A.name)} is out for a battle with a face like a turnip.`; }]]},
    {t:'A travelling bowyer', x:'An old man with a cart of yew staves. He offers one, \"the best I ever cut\", for eighty silver.', c:[
      [`Buy it for ${esc(A.name)}`, () => { if (S.silver < 80) return 'You cannot afford it. He says he will be back. He will not.'; S.silver -= 80; if (!A.traits.includes('strong') && A.traits.length < 4) { A.traits.push('strong'); return `${esc(A.name)} gains Strong arm. The bow is as good as promised.`; } giveXp(A, 80, {}); return `${esc(A.name)} trains with it. +80 xp.`; }],
      ['Send him on his way', () => 'He spits, and goes.']]},
    {t:'Letters home', x:`${n(A)} cannot write. He asks you to write to his mother, in case.`, c:[
      ['Write it', () => { giveXp(A, 50, {}); return `You write a page. He makes you read it back twice. +50 xp for ${esc(A.name)}, who fights like he means to come home.`; }],
      ['No time', () => 'He nods and does not ask again.']]},
    {t:'A stray dog', x:'A thin, filthy dog has attached itself to the company. The lads have already named it Agincourt, which is optimistic.', c:[
      ['Keep it', () => { S.buff.xp = 1; return 'Morale is up. Next battle gives 30% more experience.'; }],
      ['Shoo it', () => 'It follows you anyway. It is that kind of dog.']]},
    {t:'The friar', x:'A friar offers general absolution for the whole company, at forty silver, which he says is a discount.', c:[
      ['Pay the friar', () => { if (S.silver < 40) return 'Not enough silver. He blesses you anyway, grudgingly.'; S.silver -= 40; S.buff.friar = 1; return 'Shriven. Next battle, men who fall are half as likely to die.'; }],
      ['Decline', () => 'He mutters something in Latin that does not sound like a blessing.']]},
    {t:'A village with no one in it', x:'Doors open, fires still warm. The King has said looters hang. The lads have said they are hungry.', c:[
      ['Look the other way', () => { S.silver += 110; S.renown = Math.max(0, S.renown - 2); return 'You come away with 110 silver of candlesticks and a bad conscience. -2 renown.'; }],
      ['Forbid it', () => { S.renown += 2; return 'They grumble and march on hungry. +2 renown.'; }]]},
    {t:'A day at the butts', x:'No French in sight. The sergeant wants to drill. The men want to sleep.', c:[
      ['Drill all day', () => { S.roster.forEach(a => giveXp(a, 25, {})); return 'Everyone gains 25 xp and loses the will to live.'; }],
      ['Let them rest', () => { S.roster.forEach(a => { if (a.wounded) a.wounded--; }); return 'The wounded recover a little faster.'; }]]}
  ];
  EV = pick(events);
  openSheet(`<div class="yr sub" style="color:var(--gold);font-weight:700;letter-spacing:.1em">IN CAMP</div><div class="fell" style="font-size:26px">${EV.t}</div><p class="ev">${EV.x}</p>${EV.c.map((c, i) => `<button class="btn ${i ? '' : 'gold'} big" style="margin-top:8px" data-act="evc" data-i="${i}">${c[0]}</button>`).join('')}`);
}
function eventChoice(i){ const out = EV.c[i][1](); save(); render(); openSheet(`<div class="fell" style="font-size:24px">${EV.t}</div><p class="ev">${out}</p><button class="btn gold big" data-act="close">Carry on</button>`); }

/* ================= boot ================= */
load(); save(); render();
window.__dbg = {get S(){ return S; }, get B(){ return B; }, genLevel, startBattle, render};
}
</script>
